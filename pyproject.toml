[project]
name = "pdf-rag-assistant"
version = "1.0.0"
description = "Source-grounded PDF question-answering system with local retrieval and page-level citations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Oğuzhan Bekmezci"}]
license = {file = "LICENSE"}
keywords = ["rag", "pdf", "document-ai", "turkish-nlp", "fastapi", "qdrant", "gemini", "semantic-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
