name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Upload...\n3. Ask..."
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
